name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ecom, POSTGRES_PASSWORD: ecom, POSTGRES_DB: ecom }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecom" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ecom:ecom@localhost:5432/ecom?schema=public
      APP_URL: http://localhost:3100
      SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      SEED_DEMO: "true"
      SEED_ADMIN_PASSWORD: admin-dev-2026
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database migrations + seed
        run: npx prisma migrate deploy && npm run db:seed
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test --trace off

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: ecom-market:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
