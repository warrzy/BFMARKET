# ECOM MARKET — déploiement mono-serveur (VPS) : app + PostgreSQL + Redis + MinIO + Caddy (HTTPS automatique)
# Usage : cp .env.example .env (remplir), puis `docker compose up -d --build`
name: ecom-market

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ecom}?schema=public
  APP_URL: ${APP_URL:?définir APP_URL}
  SESSION_SECRET: ${SESSION_SECRET:?définir SESSION_SECRET}
  CRON_SECRET: ${CRON_SECRET:?définir CRON_SECRET}
  SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-ecom-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  REDIS_URL: redis://redis:6379
  OTP_DELIVERY: ${OTP_DELIVERY:-webhook}
  OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:-}
  CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
  CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
  CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
  PAYDUNYA_MASTER_KEY: ${PAYDUNYA_MASTER_KEY:-}
  PAYDUNYA_PRIVATE_KEY: ${PAYDUNYA_PRIVATE_KEY:-}
  PAYDUNYA_TOKEN: ${PAYDUNYA_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SHOP_SUBDOMAINS_ENABLED: ${SHOP_SUBDOMAINS_ENABLED:-false}
  ROOT_DOMAIN: ${ROOT_DOMAIN:-ecommarket.africa}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ecom}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?définir S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?définir S3_SECRET_KEY}
    volumes: [media:/data]

  migrate:
    build: { context: ., target: migrator }
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # Tâche horaire : rappels et expiration des abonnements
  cron:
    image: curlimages/curl:8.15.0
    restart: unless-stopped
    environment: { CRON_SECRET: "${CRON_SECRET}" }
    entrypoint: ["/bin/sh", "-c", "while true; do curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/subscriptions || true; sleep 3600; done"]
    depends_on: [app]

  # Sauvegarde quotidienne de la base (rotation 14 jours) — à synchroniser hors du serveur
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U ${POSTGRES_USER:-ecom} -Fc ${POSTGRES_DB:-ecom} > /backups/ecom-$$(date +%F-%H%M).dump && find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
